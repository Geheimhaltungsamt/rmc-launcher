[package]
name = "rmc-launcher"
version = "0.1.0"
edition = "2021"
description = "Schlanker Minecraft-Launcher in Rust, optimiert für schwache PCs und große Sichtweiten (Distant Horizons)"

[[bin]]
name = "rmc"
path = "src/main.rs"

[[bin]]
name = "rmc-gui"
path = "src/bin/gui.rs"

[dependencies]
# OpenGL-Backend (glow) statt wgpu: kleiner, startet schneller, läuft auch auf alten iGPUs.
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sysinfo = { version = "0.30", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Der Launcher selbst soll winzig und schnell sein – er beendet sich nach dem Start von Minecraft.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
